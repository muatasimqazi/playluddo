<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1500 1500" role="img" aria-label="Bazaar-themed Ludo board">
<defs>
<linearGradient id="bz-brass" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#F8E29A"></stop>
<stop offset="0.45" stop-color="#D9A845"></stop>
<stop offset="1" stop-color="#8A5E1C"></stop>
</linearGradient>
<radialGradient id="bz-gB" cx="0.42" cy="0.38" r="0.8">
<stop offset="0" stop-color="#4B78C4"></stop>
<stop offset="1" stop-color="#16285A"></stop>
</radialGradient>
<radialGradient id="bz-gR" cx="0.42" cy="0.38" r="0.8">
<stop offset="0" stop-color="#D24A3E"></stop>
<stop offset="1" stop-color="#651413"></stop>
</radialGradient>
<radialGradient id="bz-gY" cx="0.42" cy="0.38" r="0.8">
<stop offset="0" stop-color="#F0BC45"></stop>
<stop offset="1" stop-color="#94600E"></stop>
</radialGradient>
<radialGradient id="bz-gG" cx="0.42" cy="0.38" r="0.8">
<stop offset="0" stop-color="#349A6B"></stop>
<stop offset="1" stop-color="#103F2B"></stop>
</radialGradient>
<radialGradient id="bz-sheen" cx="0.4" cy="0.35" r="0.7">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"></stop>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
</radialGradient>
<radialGradient id="bz-glow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#FFB547" stop-opacity="0.55"></stop>
<stop offset="1" stop-color="#FFB547" stop-opacity="0"></stop>
</radialGradient>
<pattern id="bz-tiles" width="100" height="100" patternUnits="userSpaceOnUse">
<rect x="5" y="5" width="90" height="90" rx="8" fill="url(#bz-sheen)"></rect>
<rect x="0" y="0" width="100" height="100" fill="none" stroke="#D9A845" stroke-width="3"></rect>
</pattern>
<pattern id="bz-kilim" x="30" y="30" width="36" height="36" patternUnits="userSpaceOnUse">
<rect width="36" height="36" fill="#000000" fill-opacity="0.22"></rect>
<path d="M18,4 L32,18 L18,32 L4,18Z" fill="none" stroke="#F3E3C3" stroke-opacity="0.75" stroke-width="2"></path>
<path d="M18,12 L24,18 L18,24 L12,18Z" fill="#F3E3C3" fill-opacity="0.85"></path>
<path d="M0,0 L5,5 M36,0 L31,5 M0,36 L5,31 M36,36 L31,31" stroke="#F3E3C3" stroke-opacity="0.55" stroke-width="2"></path>
</pattern>
<polygon id="bz-star8" points="50,0 35.36,14.64 35.36,35.36 14.64,35.36 0,50 -14.64,35.36 -35.36,35.36 -35.36,14.64 -50,0 -35.36,-14.64 -35.36,-35.36 -14.64,-35.36 0,-50 14.64,-35.36 35.36,-35.36 35.36,-14.64"></polygon>
<path id="bz-dia" d="M0,-30 L22,0 L0,30 L-22,0Z"></path>
<g id="bz-tray">
<circle r="56" fill="url(#bz-brass)"></circle>
<circle r="47" fill="#1E120B"></circle>
<circle r="40" fill="none" stroke="#D9A845" stroke-width="2" stroke-dasharray="2 6"></circle>
<use href="#bz-star8" transform="scale(0.3)" fill="url(#bz-brass)"></use>
</g>
<g id="bz-safe">
<circle r="36" fill="url(#bz-brass)"></circle>
<circle r="30" fill="#1E120B"></circle>
<use href="#bz-star8" transform="scale(0.46)" fill="url(#bz-brass)"></use>
<circle r="6" fill="#1E120B"></circle>
</g>
<g id="bz-start">
<circle r="36" fill="url(#bz-brass)"></circle>
<circle r="30" fill="#1E120B"></circle>
<path d="M-15,-12 L-3,0 L-15,12 M1,-12 L13,0 L1,12" fill="none" stroke="#F3D07A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
</g>
<g id="bz-quad">
<rect x="12" y="12" width="576" height="576" rx="10" fill="none" stroke="#D9A845" stroke-width="3"></rect>
<path d="M30,30 H570 V570 H30Z M66,66 V534 H534 V66Z" fill="url(#bz-kilim)" fill-rule="evenodd"></path>
<rect x="30" y="30" width="540" height="540" fill="none" stroke="#D9A845" stroke-width="2"></rect>
<rect x="66" y="66" width="468" height="468" fill="none" stroke="#D9A845" stroke-width="2"></rect>
<use href="#bz-tray" x="160" y="160"></use>
<use href="#bz-tray" x="440" y="160"></use>
<use href="#bz-tray" x="160" y="440"></use>
<use href="#bz-tray" x="440" y="440"></use>
<use href="#bz-star8" transform="translate(300 300) scale(1.9)" fill="url(#bz-brass)"></use>
</g>
</defs>

<!-- frame -->
<rect x="-30" y="-30" width="1560" height="1560" fill="#2A1810"></rect>
<rect x="-15" y="-15" width="1530" height="1530" rx="10" fill="none" stroke="url(#bz-brass)" stroke-width="5"></rect>

<!-- home yards, as the game seats them: pomegranate (red), emerald (green), indigo (blue), saffron (yellow) -->
<g>
<rect width="600" height="600" fill="url(#bz-gR)"></rect>
<use href="#bz-quad"></use>
<use href="#bz-star8" transform="translate(300 300) scale(1.25)" fill="#651413"></use>
<circle cx="300" cy="300" r="22" fill="url(#bz-brass)"></circle>
</g>
<g transform="translate(900 0)">
<rect width="600" height="600" fill="url(#bz-gG)"></rect>
<use href="#bz-quad"></use>
<use href="#bz-star8" transform="translate(300 300) scale(1.25)" fill="#103F2B"></use>
<circle cx="300" cy="300" r="22" fill="url(#bz-brass)"></circle>
</g>
<g transform="translate(0 900)">
<rect width="600" height="600" fill="url(#bz-gB)"></rect>
<use href="#bz-quad"></use>
<use href="#bz-star8" transform="translate(300 300) scale(1.25)" fill="#16285A"></use>
<circle cx="300" cy="300" r="22" fill="url(#bz-brass)"></circle>
</g>
<g transform="translate(900 900)">
<rect width="600" height="600" fill="url(#bz-gY)"></rect>
<use href="#bz-quad"></use>
<use href="#bz-star8" transform="translate(300 300) scale(1.25)" fill="#94600E"></use>
<circle cx="300" cy="300" r="22" fill="url(#bz-brass)"></circle>
</g>

<!-- track arms -->
<rect x="600" y="0" width="300" height="600" fill="url(#bz-gG)"></rect>
<rect x="900" y="600" width="600" height="300" fill="url(#bz-gY)"></rect>
<rect x="600" y="900" width="300" height="600" fill="url(#bz-gB)"></rect>
<rect x="0" y="600" width="600" height="300" fill="url(#bz-gR)"></rect>

<!-- home lanes: parchment -->
<rect x="700" y="100" width="100" height="500" fill="#F1E2C0"></rect>
<rect x="900" y="700" width="500" height="100" fill="#F1E2C0"></rect>
<rect x="700" y="900" width="100" height="500" fill="#F1E2C0"></rect>
<rect x="100" y="700" width="500" height="100" fill="#F1E2C0"></rect>

<!-- tile bevel + brass grout -->
<rect x="600" y="0" width="300" height="600" fill="url(#bz-tiles)"></rect>
<rect x="900" y="600" width="600" height="300" fill="url(#bz-tiles)"></rect>
<rect x="600" y="900" width="300" height="600" fill="url(#bz-tiles)"></rect>
<rect x="0" y="600" width="600" height="300" fill="url(#bz-tiles)"></rect>

<!-- lane motifs -->
<g fill="#155238" stroke="#D9A845" stroke-width="3">
<use href="#bz-dia" x="750" y="150"></use><use href="#bz-dia" x="750" y="250"></use><use href="#bz-dia" x="750" y="350"></use><use href="#bz-dia" x="750" y="450"></use><use href="#bz-dia" x="750" y="550"></use>
</g>
<g fill="#A86B0F" stroke="#7A4E0E" stroke-width="3">
<use href="#bz-dia" x="950" y="750" transform="rotate(90 950 750)"></use><use href="#bz-dia" x="1050" y="750" transform="rotate(90 1050 750)"></use><use href="#bz-dia" x="1150" y="750" transform="rotate(90 1150 750)"></use><use href="#bz-dia" x="1250" y="750" transform="rotate(90 1250 750)"></use><use href="#bz-dia" x="1350" y="750" transform="rotate(90 1350 750)"></use>
</g>
<g fill="#1E3570" stroke="#D9A845" stroke-width="3">
<use href="#bz-dia" x="750" y="950"></use><use href="#bz-dia" x="750" y="1050"></use><use href="#bz-dia" x="750" y="1150"></use><use href="#bz-dia" x="750" y="1250"></use><use href="#bz-dia" x="750" y="1350"></use>
</g>
<g fill="#7A1A18" stroke="#D9A845" stroke-width="3">
<use href="#bz-dia" x="150" y="750" transform="rotate(90 150 750)"></use><use href="#bz-dia" x="250" y="750" transform="rotate(90 250 750)"></use><use href="#bz-dia" x="350" y="750" transform="rotate(90 350 750)"></use><use href="#bz-dia" x="450" y="750" transform="rotate(90 450 750)"></use><use href="#bz-dia" x="550" y="750" transform="rotate(90 550 750)"></use>
</g>

<!-- start squares (arrow medallions) -->
<use href="#bz-start" transform="translate(150 650)"></use>
<use href="#bz-start" transform="translate(850 150) rotate(90)"></use>
<use href="#bz-start" transform="translate(1350 850) rotate(180)"></use>
<use href="#bz-start" transform="translate(650 1350) rotate(270)"></use>

<!-- safe squares (star medallions) -->
<use href="#bz-safe" transform="translate(250 850)"></use>
<use href="#bz-safe" transform="translate(650 250)"></use>
<use href="#bz-safe" transform="translate(1250 650)"></use>
<use href="#bz-safe" transform="translate(850 1250)"></use>

<!-- center: four home triangles -->
<polygon points="600,600 900,600 750,750" fill="url(#bz-gG)"></polygon>
<polygon points="900,600 900,900 750,750" fill="url(#bz-gY)"></polygon>
<polygon points="900,900 600,900 750,750" fill="url(#bz-gB)"></polygon>
<polygon points="600,900 600,600 750,750" fill="url(#bz-gR)"></polygon>
<path d="M600,600 L900,900 M900,600 L600,900" stroke="#D9A845" stroke-width="3"></path>

<!-- brass dividers -->
<path d="M600,0 V1500 M900,0 V1500 M0,600 H1500 M0,900 H1500" stroke="url(#bz-brass)" stroke-width="5"></path>
<rect x="600" y="600" width="300" height="300" fill="none" stroke="#D9A845" stroke-width="6"></rect>

<!-- center medallion with lantern -->
<circle cx="750" cy="750" r="104" fill="url(#bz-brass)"></circle>
<circle cx="750" cy="750" r="95" fill="#1E120B"></circle>
<circle cx="750" cy="750" r="86" fill="none" stroke="#D9A845" stroke-width="1.5" stroke-dasharray="3 7"></circle>
<circle cx="750" cy="755" r="80" fill="url(#bz-glow)"></circle>
<g transform="translate(750 758) scale(1.1)">
<circle cx="0" cy="-66" r="7" fill="none" stroke="#D9A845" stroke-width="3"></circle>
<path d="M-4,-59 L4,-59 L3,-52 L-3,-52Z" fill="url(#bz-brass)"></path>
<path d="M-20,-38 Q-18,-54 0,-54 Q18,-54 20,-38Z" fill="url(#bz-brass)"></path>
<rect x="-26" y="-40" width="52" height="7" rx="2" fill="url(#bz-brass)"></rect>
<path d="M-24,-33 L24,-33 L34,6 L20,36 L-20,36 L-34,6Z" fill="url(#bz-brass)"></path>
<path d="M-6,30 L-6,-14 Q0,-26 6,-14 L6,30Z" fill="#FFE29A"></path>
<path d="M-12,30 L-25,6 L-18,-20 Q-13,-24 -12,-16Z" fill="#FFD27A"></path>
<path d="M12,30 L25,6 L18,-20 Q13,-24 12,-16Z" fill="#FFD27A"></path>
<path d="M-34,6 H34" stroke="#6E4512" stroke-width="3"></path>
<rect x="-16" y="36" width="32" height="7" rx="2" fill="url(#bz-brass)"></rect>
<path d="M-8,43 L8,43 L0,55Z" fill="url(#bz-brass)"></path>
</g>
<g fill="#F3D07A">
<circle cx="750" cy="664" r="3"></circle><circle cx="836" cy="750" r="3"></circle><circle cx="750" cy="836" r="3"></circle><circle cx="664" cy="750" r="3"></circle>
</g>
</svg>