<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500" role="img" aria-label="Pink glam Luddo board with vanity mirrors and hearts">
<defs>
<path id="gl-heart" d="M0,30 C-40,5 -50,-20 -32,-34 C-18,-44 -4,-36 0,-24 C4,-36 18,-44 32,-34 C50,-20 40,5 0,30Z"></path>
<path id="gl-spark" d="M0,-34 C4,-8 8,-4 34,0 C8,4 4,8 0,34 C-4,8 -8,4 -34,0 C-8,-4 -4,-8 0,-34Z"></path>

<linearGradient id="gl-glass" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#F4F0FF"></stop>
<stop offset="0.55" stop-color="#E3E6F7"></stop>
<stop offset="1" stop-color="#CBD3EE"></stop>
</linearGradient>
<radialGradient id="gl-gloss" cx="0.35" cy="0.3" r="0.65">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"></stop>
<stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.15"></stop>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
</radialGradient>
<linearGradient id="gl-gem" x1="0" y1="0" x2="0.8" y2="1">
<stop offset="0" stop-color="#FF8CC6"></stop>
<stop offset="0.5" stop-color="#E6268C"></stop>
<stop offset="1" stop-color="#A3135F"></stop>
</linearGradient>

<!-- gingham overlay -->
<pattern id="gl-gingham" width="60" height="60" patternUnits="userSpaceOnUse">
<rect x="0" y="0" width="30" height="60" fill="#FFFFFF" fill-opacity="0.3"></rect>
<rect x="0" y="0" width="60" height="30" fill="#FFFFFF" fill-opacity="0.3"></rect>
</pattern>
<!-- polka dots -->
<pattern id="gl-dots" x="-60" y="-60" width="30" height="30" patternUnits="userSpaceOnUse">
<rect width="30" height="30" fill="#E6268C"></rect>
<circle cx="8" cy="8" r="5" fill="#FFFFFF"></circle>
<circle cx="23" cy="23" r="5" fill="#FFFFFF"></circle>
</pattern>
<!-- glossy track tiles -->
<pattern id="gl-cell" width="100" height="100" patternUnits="userSpaceOnUse">
<rect width="100" height="100" fill="#FFF7FB"></rect>
<rect x="10" y="10" width="80" height="80" rx="16" fill="none" stroke="#F6A9CC" stroke-width="3" stroke-dasharray="7 6"></rect>
</pattern>
<pattern id="gl-laneheart" width="100" height="100" patternUnits="userSpaceOnUse">
<rect x="10" y="10" width="80" height="80" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="7 6"></rect>
<use href="#gl-heart" transform="translate(50 52) scale(0.62)" fill="#FFFFFF"></use>
</pattern>
<pattern id="gl-grout" width="100" height="100" patternUnits="userSpaceOnUse">
<rect width="100" height="100" fill="none" stroke="#C2186E" stroke-width="4"></rect>
</pattern>

<clipPath id="gl-glassclip"><ellipse cx="300" cy="300" rx="106" ry="136"></ellipse></clipPath>

<!-- vanity mirror with bulbs (colour-neutral) -->
<g id="gl-mirror">
<ellipse cx="300" cy="300" rx="140" ry="170" fill="#FFFFFF"></ellipse>
<ellipse cx="300" cy="300" rx="140" ry="170" fill="none" stroke="#F6A9CC" stroke-width="4"></ellipse>
<g fill="#FFF3B0" stroke="#F2C94C" stroke-width="3">
<circle cx="425" cy="300" r="10"></circle><circle cx="408.25" cy="377.5" r="10"></circle><circle cx="362.5" cy="434.2" r="10"></circle>
<circle cx="300" cy="455" r="10"></circle><circle cx="237.5" cy="434.2" r="10"></circle><circle cx="191.75" cy="377.5" r="10"></circle>
<circle cx="175" cy="300" r="10"></circle><circle cx="191.75" cy="222.5" r="10"></circle><circle cx="237.5" cy="165.8" r="10"></circle>
<circle cx="300" cy="145" r="10"></circle><circle cx="362.5" cy="165.8" r="10"></circle><circle cx="408.25" cy="222.5" r="10"></circle>
</g>
<ellipse cx="300" cy="300" rx="106" ry="136" fill="url(#gl-glass)"></ellipse>
<g clip-path="url(#gl-glassclip)" fill="#FFFFFF" fill-opacity="0.75">
<path d="M190,250 L290,150 L310,150 L190,270Z"></path>
<path d="M190,300 L330,160 L345,170 L195,320Z" fill-opacity="0.45"></path>
<path d="M300,450 L410,340 L410,360 L320,450Z" fill-opacity="0.5"></path>
</g>
</g>

<!-- token compact: inner disc takes the player colour -->
<g id="gl-spot">
<circle r="58" fill="#FFFFFF"></circle>
<circle r="58" fill="none" stroke="#F6A9CC" stroke-width="3"></circle>
<circle r="49"></circle>
<circle r="49" fill="url(#gl-gloss)"></circle>
<use href="#gl-heart" transform="translate(0 4) scale(0.5)" fill="#FFFFFF"></use>
</g>

<g id="gl-yard">
<rect width="600" height="600" fill="url(#gl-gingham)"></rect>
<rect x="22" y="22" width="556" height="556" rx="44" fill="none" stroke="#FFFFFF" stroke-width="12"></rect>
<rect x="40" y="40" width="520" height="520" rx="30" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 8"></rect>
<use href="#gl-mirror"></use>
</g>

<path id="gl-arrow" d="M-20,-20 L0,0 L-20,20 M2,-20 L22,0 L2,20" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path>
<g id="gl-safe">
<use href="#gl-spark" fill="#E6268C"></use>
<use href="#gl-spark" transform="translate(24 -24) scale(0.35)" fill="#9A62D3"></use>
<use href="#gl-spark" transform="translate(-24 24) scale(0.28)" fill="#F7B928"></use>
</g>
</defs>

<!-- polka-dot frame -->
<rect x="-60" y="-60" width="1620" height="1620" rx="60" fill="url(#gl-dots)"></rect>
<rect x="-46" y="-46" width="1592" height="1592" rx="48" fill="none" stroke="#FFFFFF" stroke-width="6"></rect>

<!-- home yards: hot pink, aqua, lavender, sunshine -->
<g>
<rect width="600" height="600" fill="#E6268C"></rect>
<use href="#gl-yard"></use>
<use href="#gl-heart" transform="translate(300 300) scale(1.3)" fill="#E6268C"></use>
<g fill="#E6268C"><use href="#gl-spot" x="118" y="118"></use><use href="#gl-spot" x="482" y="118"></use><use href="#gl-spot" x="118" y="482"></use><use href="#gl-spot" x="482" y="482"></use></g>
</g>
<g transform="translate(900 0)">
<rect width="600" height="600" fill="#23B5C9"></rect>
<use href="#gl-yard"></use>
<use href="#gl-heart" transform="translate(300 300) scale(1.3)" fill="#23B5C9"></use>
<g fill="#23B5C9"><use href="#gl-spot" x="118" y="118"></use><use href="#gl-spot" x="482" y="118"></use><use href="#gl-spot" x="118" y="482"></use><use href="#gl-spot" x="482" y="482"></use></g>
</g>
<g transform="translate(0 900)">
<rect width="600" height="600" fill="#9A62D3"></rect>
<use href="#gl-yard"></use>
<use href="#gl-heart" transform="translate(300 300) scale(1.3)" fill="#9A62D3"></use>
<g fill="#9A62D3"><use href="#gl-spot" x="118" y="118"></use><use href="#gl-spot" x="482" y="118"></use><use href="#gl-spot" x="118" y="482"></use><use href="#gl-spot" x="482" y="482"></use></g>
</g>
<g transform="translate(900 900)">
<rect width="600" height="600" fill="#F7B928"></rect>
<use href="#gl-yard"></use>
<use href="#gl-heart" transform="translate(300 300) scale(1.3)" fill="#F7B928"></use>
<g fill="#F7B928"><use href="#gl-spot" x="118" y="118"></use><use href="#gl-spot" x="482" y="118"></use><use href="#gl-spot" x="118" y="482"></use><use href="#gl-spot" x="482" y="482"></use></g>
</g>

<!-- track arms -->
<g fill="url(#gl-cell)">
<rect x="600" y="0" width="300" height="600"></rect>
<rect x="900" y="600" width="600" height="300"></rect>
<rect x="600" y="900" width="300" height="600"></rect>
<rect x="0" y="600" width="600" height="300"></rect>
</g>

<!-- home lanes -->
<rect x="700" y="100" width="100" height="500" fill="#23B5C9"></rect>
<rect x="900" y="700" width="500" height="100" fill="#F7B928"></rect>
<rect x="700" y="900" width="100" height="500" fill="#9A62D3"></rect>
<rect x="100" y="700" width="500" height="100" fill="#E6268C"></rect>
<g fill="url(#gl-laneheart)">
<rect x="700" y="100" width="100" height="500"></rect>
<rect x="900" y="700" width="500" height="100"></rect>
<rect x="700" y="900" width="100" height="500"></rect>
<rect x="100" y="700" width="500" height="100"></rect>
</g>

<!-- start squares -->
<rect x="100" y="600" width="100" height="100" fill="#E6268C"></rect>
<rect x="800" y="100" width="100" height="100" fill="#23B5C9"></rect>
<rect x="1300" y="800" width="100" height="100" fill="#F7B928"></rect>
<rect x="600" y="1300" width="100" height="100" fill="#9A62D3"></rect>
<use href="#gl-arrow" transform="translate(148 650)"></use>
<use href="#gl-arrow" transform="translate(850 148) rotate(90)"></use>
<use href="#gl-arrow" transform="translate(1352 850) rotate(180)"></use>
<use href="#gl-arrow" transform="translate(650 1352) rotate(270)"></use>

<!-- safe squares (sparkles) -->
<use href="#gl-safe" x="250" y="850"></use>
<use href="#gl-safe" x="650" y="250"></use>
<use href="#gl-safe" x="1250" y="650"></use>
<use href="#gl-safe" x="850" y="1250"></use>

<!-- grout -->
<g fill="url(#gl-grout)">
<rect x="600" y="0" width="300" height="600"></rect>
<rect x="900" y="600" width="600" height="300"></rect>
<rect x="600" y="900" width="300" height="600"></rect>
<rect x="0" y="600" width="600" height="300"></rect>
</g>

<!-- center: home triangles + faceted heart gem -->
<polygon points="600,600 900,600 750,750" fill="#23B5C9"></polygon>
<polygon points="900,600 900,900 750,750" fill="#F7B928"></polygon>
<polygon points="900,900 600,900 750,750" fill="#9A62D3"></polygon>
<polygon points="600,900 600,600 750,750" fill="#E6268C"></polygon>
<rect x="600" y="600" width="300" height="300" fill="url(#gl-gingham)"></rect>
<path d="M600,600 L900,900 M900,600 L600,900" stroke="#FFFFFF" stroke-width="5"></path>
<path d="M600,0 V1500 M900,0 V1500 M0,600 H1500 M0,900 H1500" stroke="#C2186E" stroke-width="6"></path>
<rect x="0" y="0" width="1500" height="1500" fill="none" stroke="#FFFFFF" stroke-width="8"></rect>
<rect x="600" y="600" width="300" height="300" fill="none" stroke="#FFFFFF" stroke-width="8"></rect>
<g transform="translate(750 750)">
<circle r="114" fill="#FFFFFF"></circle>
<circle r="104" fill="none" stroke="#F6A9CC" stroke-width="3" stroke-dasharray="8 7"></circle>
<use href="#gl-heart" transform="translate(0 6) scale(2.05)" fill="url(#gl-gem)"></use>
<path d="M0,-43 L-36,-6 L0,67 L36,-6Z M-36,-6 H36 M-66,-28 L-36,-6 M66,-28 L36,-6 M-44,-76 L-36,-6 M44,-76 L36,-6" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5" stroke-linejoin="round"></path>
<ellipse cx="-38" cy="-42" rx="16" ry="9" transform="rotate(-35 -38 -42)" fill="#FFFFFF" fill-opacity="0.75"></ellipse>
<use href="#gl-spark" transform="translate(70 -70) scale(0.45)" fill="#9A62D3"></use>
<use href="#gl-spark" transform="translate(-76 60) scale(0.32)" fill="#23B5C9"></use>
<use href="#gl-spark" transform="translate(78 58) scale(0.26)" fill="#F7B928"></use>
</g>
</svg>